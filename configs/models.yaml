# Both models are free-tier on OpenRouter as of Aug 2026. Pin the exact
# version string here rather than in code, since free routes get swapped
# or pulled without much notice and I want one place to update if that happens.

models:
  glm:
    id: "z-ai/glm-5.2:free"
    temperature: 0.0
    max_tokens: 512

  gemma:
    id: "google/gemma-4-31b-it:free"
    temperature: 0.0
    max_tokens: 512

run:
  max_hops: 7          # hard cap on Thought/Action/Observation cycles, same for every condition
  stop_actions: ["Finish"]
  request_timeout_s: 60
  retry_attempts: 4
  retry_backoff_s: 5   # free-tier rate limits bite; back off and retry rather than fail the whole run
